<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Veri Transferi - Bilgisayar</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --bg:#0b1220; --surface:#151d2f; --border:#2a3448; --text:#e7ecf5; --muted:#8f9bb3; --accent:#4ade80; --blue:#60a5fa; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { padding:15px; background:#16213a; border-bottom:1px solid var(--border); text-align:center; font-weight:bold; font-size:18px; }
  
  .container { flex:1; display:flex; flex-direction:column; padding:20px; max-width:800px; margin:0 auto; width:100%; box-sizing:border-box; }
  
  /* QR Ekranı */
  #qrScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  #qrArea { background:white; padding:20px; border-radius:12px; margin-bottom:20px; }
  .instruction { font-size:16px; color:var(--muted); margin-bottom:10px; text-align:center; }
  .status-badge { padding:6px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--border); font-size:13px; color:var(--blue); }
  
  /* Transfer Ekranı */
  #transferScreen { display:none; flex-direction:column; height:100%; }
  .connected-info { text-align:center; color:var(--accent); margin-bottom:15px; font-weight:bold; font-size:14px; }
  
  .chat-box { flex:1; background:#080b13; border:1px solid var(--border); border-radius:10px; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:15px; }
  .msg { padding:10px 15px; border-radius:8px; max-width:80%; font-size:14px; word-wrap:break-word; position:relative; }
  .msg.sent { background:var(--blue); color:#000; align-self:flex-end; border-bottom-right-radius:0; }
  .msg.received { background:var(--surface); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:0; }
  .msg img { max-width:100%; max-height:200px; border-radius:6px; margin-top:5px; display:block; cursor:pointer; }
  .msg a { color:inherit; text-decoration:underline; font-weight:bold; display:block; margin-top:5px; }
  
  .controls { display:flex; gap:10px; }
  .controls input[type="text"] { flex:1; padding:12px; background:var(--surface); border:1px solid var(--border); color:white; border-radius:8px; outline:none; }
  .controls button { padding:12px 20px; border:0; border-radius:8px; font-weight:bold; cursor:pointer; }
  .btn-send { background:var(--accent); color:#000; }
  .btn-file { background:var(--surface); border:1px solid var(--border); color:white; }
  .progress-bar { display:none; height:4px; background:var(--border); border-radius:2px; margin-top:5px; overflow:hidden; }
  .progress-bar div { height:100%; background:var(--blue); width:0%; transition:width 0.2s; }
</style>
</head>
<body>

<header>💻 Bilgisayar Arayüzü</header>

<div class="container">
  <!-- Başlangıç (QR) Ekranı -->
  <div id="qrScreen">
    <div class="instruction">Telefonunuzdan bu QR kodu okutun</div>
    <div id="qrArea">QR Yükleniyor...</div>
    <div class="status-badge" id="pcStatus">Sunucuya Bağlanılıyor...</div>
  </div>

  <!-- Transfer Ekranı -->
  <div id="transferScreen">
    <div class="connected-info">✅ Cihaz Bağlandı (Uçtan Uca Şifreli)</div>
    
    <div class="chat-box" id="chatBox">
      <!-- Mesajlar buraya -->
    </div>
    
    <div class="progress-bar" id="progressBar"><div id="progressFill"></div></div>
    
    <div class="controls">
      <button class="btn-file" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)">
      <input type="text" id="msgInput" placeholder="Bir mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="btn-send" onclick="sendMessage()">Gönder</button>
    </div>
  </div>
</div>

<script src="desktop.js"></script>
</body>
</html>
